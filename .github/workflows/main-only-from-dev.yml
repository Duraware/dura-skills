name: main accepts only dev

on:
  pull_request:
    branches: [main]

jobs:
  source-branch:
    name: source-branch-is-dev
    runs-on: ubuntu-latest
    steps:
      - name: Check that the pull request comes from dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ] || [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Pull requests into main must come from the dev branch of this repository (got '${{ github.event.pull_request.head.repo.full_name }}:${{ github.head_ref }}')."
            exit 1
          fi
          echo "Source branch is dev."
